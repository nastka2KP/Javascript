<!DOCTYPE html> 
<head> 
 <title> obliczenia</title> 
 <meta charset="utf-8"> 
</head> 
<body>
      <div style="color:green;font-size:50px;">
       <script language="JavaScript">
            var D1=prompt("Data1=","");
            var D2=prompt("Data2=","");
            var sekund;
            var a=parseFloat(D1);
            var b=parseFloat(D2);
               sekund=(a-b)*24*60*60;
            document.write("Ilość sekund pomiędzy dniami " +a+" i "+b+" = "+sekund+"<br>");
            function okno_zamknij()
               {
               window.close()
               }
       </script>
      </div>
     <input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
</body>
</html>
